name: Build PitBuzz Android
on: [workflow_dispatch, push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '17'}
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with: {gradle-version: '8.9'}
      - run: gradle assembleDebug
        working-directory: mobile/android
      - name: Verify APK
        run: test -n "$(find mobile/android/app/build/outputs/apk/debug -name '*.apk' -print -quit)"
      - uses: actions/upload-artifact@v4
        with:
          name: PitBuzz-Android-debug
          path: mobile/android/app/build/outputs/apk/debug/*.apk
